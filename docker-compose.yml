version: '3'

services:
  jms_all:
    image: jumpserver/jms_all:v3.10.0
    container_name: jms_all
    restart: always
    tty: true
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - BOOTSTRAP_TOKEN=${BOOTSTRAP_TOKEN}
      - DB_HOST=mysql
      - DB_USER=jumpserver
      - DB_PASSWORD=jumpserver
      - DB_NAME=jumpserver
      - REDIS_HOST=redis
      - REDIS_PASSWORD=jumpserver
    volumes:
      - ./data:/opt/jumpserver/data
      - ./logs:/opt/jumpserver/logs
    ports:
      - "80:80"
      - "2222:2222"
    networks:
      - jumpserver

  mysql:
    image: mysql:8.0
    container_name: jms_mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: jumpserver
      MYSQL_DATABASE: jumpserver
      MYSQL_USER: jumpserver
      MYSQL_PASSWORD: jumpserver
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jumpserver

  redis:
    image: redis:6.2
    container_name: jms_redis
    restart: always
    command: redis-server --requirepass jumpserver
    volumes:
      - redis_data:/data
    networks:
      - jumpserver

networks:
  jumpserver:
    driver: bridge

volumes:
  mysql_data:
  redis_data: 